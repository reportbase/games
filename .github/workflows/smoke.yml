name: Smoke test

# Once a change, on its PR (Oct 17: "its not needed for every change."). Not again on main after the merge, which ran
# the same code the PR just passed, and not for a PR that only touches notes (Markdown). Run by hand from the Actions
# tab when wanted.
on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Side by side (Oct 28: "2", the faster smoke test): on one runner a run took 30 minutes, 26 of the smoke test and 3.5 of
# the course test. The smoke test is cut into parts (seven, three to five minutes each; since 12 Nov 2026 each a file of its
# own, tests/part1.mjs to part7.mjs, with what they share in tests/harness.mjs) and every part and the course test run as jobs of their own at once, so a run takes about as long as its longest part. The last job keeps
# the name "smoke" and passes only when every part and the course have passed, so the PR's check reads as it did.
# The runner stays on ubuntu-24.04 and Playwright at 1.56.1 (12 Nov 2026). Playwright 1.63.0, whose Chromium runs on
# ubuntu-latest (26.04), was tried on both runners. On each the tanks' turn had not ended 20 s after a real tap fired
# (state still 'play', one turn), so that is the newer Chromium, not the runner; on 26.04 the bottom row's long press
# did not toggle it either (the 24.04 run was not waited for). 1.56.1 has no Chromium for 26.04, so both move together, once those two
# checks pass on the newer browser.
jobs:
  part:
    name: smoke ${{ matrix.shard }}/7
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # (Oct 28: a CDN that would not answer held every part's page from loading. The libraries the page loads from CDNs are
      # installed here at the same versions and served by the tests from them, LIBS_DIR, as in a sandbox.)
      - run: npm install --prefix "$RUNNER_TEMP/libs" --no-save --no-package-lock three@0.128.0 chess.js@1.4.0 unzipit@2.0.1
      - run: node tests/part${{ matrix.shard }}.mjs
        env:
          LIBS_DIR: ${{ runner.temp }}/libs/node_modules

  course:
    name: golf course
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # (Oct 28: a CDN that would not answer held every part's page from loading. The libraries the page loads from CDNs are
      # installed here at the same versions and served by the tests from them, LIBS_DIR, as in a sandbox.)
      - run: npm install --prefix "$RUNNER_TEMP/libs" --no-save --no-package-lock three@0.128.0 chess.js@1.4.0 unzipit@2.0.1
      - run: node tests/golf-course.mjs
        env:
          LIBS_DIR: ${{ runner.temp }}/libs/node_modules

  smoke:
    needs: [part, course]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: every part and the course passed
        run: |
          echo "parts: ${{ needs.part.result }}, course: ${{ needs.course.result }}"
          test "${{ needs.part.result }}" = success && test "${{ needs.course.result }}" = success
