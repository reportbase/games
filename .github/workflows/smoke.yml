name: Smoke test

# Once a change, on its PR (Oct 17: "its not needed for every change."). Not again on main after the merge, which ran
# the same code the PR just passed, and not for a PR that only touches notes (Markdown). Run by hand from the Actions
# tab when wanted.
on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Side by side (Oct 28: "2", the faster smoke test): on one runner a run took 30 minutes, 26 of the smoke test and 3.5 of
# the course test. The smoke test is cut into parts (PARTS in tests/smoke.mjs, seven, three to five minutes each) and every part
# and the course test run as jobs of their own at once, so a run takes about as long as its longest part. The last job keeps
# the name "smoke" and passes only when every part and the course have passed, so the PR's check reads as it did.
jobs:
  part:
    name: smoke ${{ matrix.shard }}/7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
        env:
          SHARD: ${{ matrix.shard }}/7

  course:
    name: golf course
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tests/golf-course.mjs

  smoke:
    needs: [part, course]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every part and the course passed
        run: |
          echo "parts: ${{ needs.part.result }}, course: ${{ needs.course.result }}"
          test "${{ needs.part.result }}" = success && test "${{ needs.course.result }}" = success
