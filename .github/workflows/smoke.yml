name: Smoke test

# Once a change, on its PR (Oct 17: "its not needed for every change."). Not again on main after the merge, which ran
# the same code the PR just passed, and not for a PR that only touches notes (Markdown). Run by hand from the Actions
# tab when wanted.
on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30                  # (smoke takes ~12 min since every board in view is drawn in full, Oct 12, then the course test)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
