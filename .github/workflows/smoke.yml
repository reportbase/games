name: Smoke test

# Once a change, on its PR (Oct 17: "its not needed for every change."). Not again on main after the merge, which ran
# the same code the PR just passed, and not for a PR that only touches notes (Markdown). Run by hand from the Actions
# tab when wanted.
on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Side by side (Oct 28: "2", the faster smoke test): on one runner a run took 30 minutes, 26 of the smoke test and 3.5 of
# the course test. The smoke test is cut into parts (PARTS in tests/smoke.mjs, seven, three to five minutes each) and every part
# and the course test run as jobs of their own at once, so a run takes about as long as its longest part. The last job keeps
# the name "smoke" and passes only when every part and the course have passed, so the PR's check reads as it did.
# The runner stays on ubuntu-24.04 (12 Nov 2026): on ubuntu-latest (26.04) with the same Playwright two checks that wait on
# the page's frames ran out of time (the tanks' computer not answering in 20 s, the bottom row's long press), the software
# renderer drawing slower there. Playwright 1.63.0 has a Chromium for both, so moving on is a change of this line once the
# checks' waits no longer depend on the frame rate.
jobs:
  part:
    name: smoke ${{ matrix.shard }}/7
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # (Oct 28: a CDN that would not answer held every part's page from loading. The libraries the page loads from CDNs are
      # installed here at the same versions and served by the tests from them, LIBS_DIR, as in a sandbox.)
      - run: npm install --prefix "$RUNNER_TEMP/libs" --no-save --no-package-lock three@0.128.0 chess.js@1.4.0 unzipit@2.0.1
      - run: node tests/smoke.mjs
        env:
          SHARD: ${{ matrix.shard }}/7
          LIBS_DIR: ${{ runner.temp }}/libs/node_modules

  course:
    name: golf course
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # (Oct 28: a CDN that would not answer held every part's page from loading. The libraries the page loads from CDNs are
      # installed here at the same versions and served by the tests from them, LIBS_DIR, as in a sandbox.)
      - run: npm install --prefix "$RUNNER_TEMP/libs" --no-save --no-package-lock three@0.128.0 chess.js@1.4.0 unzipit@2.0.1
      - run: node tests/golf-course.mjs
        env:
          LIBS_DIR: ${{ runner.temp }}/libs/node_modules

  smoke:
    needs: [part, course]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: every part and the course passed
        run: |
          echo "parts: ${{ needs.part.result }}, course: ${{ needs.course.result }}"
          test "${{ needs.part.result }}" = success && test "${{ needs.course.result }}" = success
